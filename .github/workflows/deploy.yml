name: Deploy

on:
  push:
    branches:
      - Main   # ← 大文字のMに修正
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: w7s-io/w7s-cloud@v1
        with:
          token: ${{ github.token }}
          install-command: npm ci   # 依存関係のインストール
          build-command: npm run build   # ビルドの実行
          working-directory: .   # リポジトリのルート
